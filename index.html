<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر فالكون للخدمات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #151c2c;
      border: 1px solid #232d42;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #38bdf8;
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 5px;
      background: #0b0f19;
      color: #94a3b8;
      border: 1px solid #232d42;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0b0f19;
      border: 1px solid #232d42;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    .price-box {
      background: #0b0f19;
      border: 1px dashed #334155;
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .price-box span {
      font-size: 14px;
      color: #94a3b8;
    }

    .price-value {
      font-size: 20px;
      font-weight: bold;
      color: #22c55e;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    /* نافذة التأكيد */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 100;
    }

    .modal-box {
      background: #151c2c;
      border: 1px solid #232d42;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .modal-box h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .details-text {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .wallet-box {
      background: #0b0f19;
      border: 1px solid #232d42;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 15px;
    }

    .wa-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .close-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>منصة فالكون للخدمات</h1>
      <p>شحن تيك توك، انستغرام، وسناب شات بدون كلمة مرور</p>
    </div>

    <!-- أزرار المنصات -->
    <div class="tabs">
      <button type="button" class="tab-btn active" onclick="setPlatform('tiktok', this)">تيك توك</button>
      <button type="button" class="tab-btn" onclick="setPlatform('instagram', this)">انستغرام</button>
      <button type="button" class="tab-btn" onclick="setPlatform('snapchat', this)">سناب شات</button>
    </div>

    <!-- نموذج الإدخال -->
    <form id="orderForm" onsubmit="submitForm(event)">
      <div class="form-group">
        <label id="inputLabel">اسم المستخدم أو رابط الحساب (تيك توك)</label>
        <input type="text" id="accountInput" placeholder="@username" required>
      </div>

      <div class="form-group">
        <label>اختر الباقة المطلوبة</label>
        <select id="packageSelect" onchange="calculatePrice()"></select>
      </div>

      <div class="price-box">
        <span>السعر المطلوب:</span>
        <span class="price-value" id="displayPrice">0.00 $</span>
      </div>

      <button type="submit" class="submit-btn">إتمام الطلب الآن</button>
    </form>
  </div>

  <!-- نافذة الدفع -->
  <div class="modal" id="orderModal">
    <div class="modal-box">
      <h3>تأكيد الطلب</h3>
      <div class="details-text" id="orderSummary"></div>

      <label style="font-size: 12px; display: block; margin-bottom: 4px;">عنوان المحفظة (USDT - TRC20):</label>
      <div class="wallet-box" id="walletAddress">TFxxxxxxxYourTRC20Addressxxxxxxxxxx</div>

      <a id="whatsappLink" class="wa-btn" target="_blank">تأكيد عبر واتساب</a>
      <button type="button" class="close-btn" onclick="hideModal()">إغلاق</button>
    </div>
  </div>

  <script>
    // الإعدادات المباشرة
    var myWhatsApp = "905XXXXXXXXX"; // ضع رقمك الدولي هنا
    var myTRC20 = "TFxxxxxxxYourTRC20Addressxxxxxxxxxx"; // ضع عنوان محفظتك هنا

    var data = {
      tiktok: [
        { title: "500 متابع سريع", price: 2.5 },
        { title: "1000 متابع مع ضمان", price: 4.5 },
        { title: "2500 متابع مميز", price: 9.9 },
        { title: "5000 مشاهدة للفيديوهات", price: 1.5 }
      ],
      instagram: [
        { title: "500 متابع مكس", price: 2.0 },
        { title: "1000 متابع ضمان تعويض", price: 3.8 },
        { title: "2000 متابع VIP", price: 7.0 },
        { title: "1000 لايك", price: 1.2 }
      ],
      snapchat: [
        { title: "500 إضافة سناب", price: 4.0 },
        { title: "1000 متابع ملف تعريفي", price: 7.5 },
        { title: "2500 متابع ملف تعريفي", price: 16.0 },
        { title: "5000 مشاهدة ستوري", price: 5.0 }
      ]
    };

    var current = 'tiktok';

    function setPlatform(platform, btn) {
      current = platform;
      var buttons = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('active');
      }
      btn.classList.add('active');

      var label = document.getElementById('inputLabel');
      if (platform === 'tiktok') label.innerText = "اسم المستخدم أو رابط الحساب (تيك توك)";
      if (platform === 'instagram') label.innerText = "اسم المستخدم أو رابط الحساب (انستغرام)";
      if (platform === 'snapchat') label.innerText = "اسم المستخدم (سناب شات)";

      updateOptions();
    }

    function updateOptions() {
      var select = document.getElementById('packageSelect');
      select.innerHTML = "";
      var list = data[current];
      for (var i = 0; i < list.length; i++) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.innerText = list[i].title + " - (" + list[i].price + " $)";
        select.appendChild(opt);
      }
      calculatePrice();
    }

    function calculatePrice() {
      var select = document.getElementById('packageSelect');
      var index = select.value;
      if (data[current][index]) {
        document.getElementById('displayPrice').innerText = data[current][index].price.toFixed(2) + " $";
      }
    }

    function submitForm(e) {
      e.preventDefault();
      var acc = document.getElementById('accountInput').value;
      var index = document.getElementById('packageSelect').value;
      var pkg = data[current][index];

      var summary = "الخدمة: " + current.toUpperCase() + "<br>الحساب: " + acc + "<br>الباقة: " + pkg.title + "<br>المبلغ المطلوب: " + pkg.price + " $";
      document.getElementById('orderSummary').innerHTML = summary;
      document.getElementById('walletAddress').innerText = myTRC20;

      var waText = encodeURIComponent("طلب جديد من المتجر:\n- المنصة: " + current + "\n- الحساب: " + acc + "\n- الباقة: " + pkg.title + "\n- السعر: " + pkg.price + " $");
      document.getElementById('whatsappLink').href = "https://wa.me/" + myWhatsApp + "?text=" + waText;

      document.getElementById('orderModal').style.display = 'flex';
    }

    function hideModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    // تشغيل القوائم تلقائياً
    updateOptions();
  </script>
</body>
</html>
