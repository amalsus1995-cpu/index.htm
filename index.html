<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر فالكون برو | لخدمات التواصل الاجتماعي</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-hover: #1c2742;
      --primary: #f59e0b;
      --primary-gradient: linear-gradient(135deg, #f59e0b, #ea580c);
      --text: #ffffff;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
      line-height: 1.5;
    }

    /* شريط الرأس */
    header {
      background: rgba(19, 27, 46, 0.8);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .main-container {
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
    }

    /* بنر ترحيبي */
    .hero-banner {
      background: var(--primary-gradient);
      border-radius: 18px;
      padding: 20px;
      color: white;
      text-align: center;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2);
    }

    .hero-banner h2 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .hero-banner p {
      font-size: 13px;
      opacity: 0.95;
    }

    /* شريط المنصات (أزرار شبكات التواصل) */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .platforms-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .platform-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .platform-btn:active, .platform-btn.active {
      background: #1e293b;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .platform-btn img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .platform-btn span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }

    /* شبكة الخدمات */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .service-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .service-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.4;
      min-height: 38px;
    }

    .service-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .service-price {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
    }

    .btn-buy {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* نافذة الطلب */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .modal-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 14px;
      text-align: right;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .btn-whatsapp {
      display: block;
      width: 100%;
      background: #22c55e;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
    }

    .btn-close {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ متجر فالكون برو</div>
    <div style="font-size: 12px; color: #10b981;">● التنفيذ فوري 24/7</div>
  </header>

  <div class="main-container">
    
    <div class="hero-banner">
      <h2>شحن وتكبير حسابات التواصل الاجتماعي</h2>
      <p>خدمات حقيقية وسريعة بأسعار الجملة مع ضمان تعويض النقص</p>
    </div>

    <!-- شبكات التواصل الاجتماعي المعروضة في اللوحة -->
    <div class="section-title">اختر شبكة التواصل الاجتماعي:</div>
    <div class="platforms-grid">
      <div class="platform-btn active" onclick="showCategory('tiktok', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="تيك توك">
        <span>تيك توك</span>
      </div>
      <div class="platform-btn" onclick="showCategory('instagram', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="إنستغرام">
        <span>انستغرام</span>
      </div>
      <div class="platform-btn" onclick="showCategory('snapchat', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384068.png" alt="سناب شات">
        <span>سناب شات</span>
      </div>
      <div class="platform-btn" onclick="showCategory('youtube', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="يوتيوب">
        <span>يوتيوب</span>
      </div>
      <div class="platform-btn" onclick="showCategory('telegram', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="تيليجرام">
        <span>تيليجرام</span>
      </div>
      <div class="platform-btn" onclick="showCategory('facebook', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="فيسبوك">
        <span>فيسبوك</span>
      </div>
      <div class="platform-btn" onclick="showCategory('twitter', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="تويتر X">
        <span>تويتر (X)</span>
      </div>
      <div class="platform-btn" onclick="showCategory('other', this)">
        <img src="https://cdn-icons-png.flaticon.com/512/10473/10473663.png" alt="حركة مرور وزيارات">
        <span>زيارات ويب</span>
      </div>
    </div>

    <!-- شبكة الخدمات -->
    <div class="section-title" id="categoryTitle">خدمات تيك توك المتوفرة</div>
    <div class="services-grid" id="servicesBox"></div>

  </div>

  <!-- نافذة الشراء والتواصل المباشر -->
  <div class="modal" id="orderModal">
    <div class="modal-box">
      <h3 id="popTitle">طلب الخدمة</h3>
      <div class="form-group">
        <label>رابط الحساب أو اسم المستخدم (Username):</label>
        <input type="text" id="targetAccount" placeholder="@username أو رابط الحساب">
      </div>
      <div class="form-group">
        <label>السعر المطلوب:</label>
        <div style="font-size: 18px; font-weight: bold; color: var(--primary);" id="popPrice"></div>
      </div>
      
      <a id="waButton" class="btn-whatsapp" target="_blank">تأكيد الطلب عبر واتساب</a>
      <button class="btn-close" onclick="closeModal()">إلغاء</button>
    </div>
  </div>

  <script>
    const MY_PHONE = "905317796427";

    const DATABASE = {
      tiktok: [
        { title: "1000 متابع تيك توك حقيقي وسريع", price: "$4.50" },
        { title: "5000 مشاهدة سريعة اكسبلور للفيديوهات", price: "$1.20" },
        { title: "1000 لايك تيك توك حسابات نشطة", price: "$1.80" },
        { title: "2500 متابع تيك توك ضمان 30 يوم", price: "$9.80" }
      ],
      instagram: [
        { title: "1000 متابع انستغرام VIP ضمان تعويض", price: "$3.80" },
        { title: "1000 لايك انستغرام عالي الجودة", price: "$0.90" },
        { title: "5000 مشاهدة ريلز سريعة", price: "$0.80" },
        { title: "2000 متابع مكس عربي وأجنبي", price: "$6.50" }
      ],
      snapchat: [
        { title: "500 متابع ملف تعريفي سناب شات", price: "$4.50" },
        { title: "1000 إضافة سريعة للملف التعريفي", price: "$7.90" },
        { title: "5000 مشاهدة ستوري سناب شات", price: "$3.90" }
      ],
      youtube: [
        { title: "1000 مشترك يوتيوب حقيقي وثابت", price: "$12.00" },
        { title: "4000 ساعة مشاهدة لتحقيق الدخل", price: "$35.00" },
        { title: "5000 مشاهدة فيديو عالية الجودة", price: "$4.50" }
      ],
      telegram: [
        { title: "1000 عضو قناة تيليجرام نشط", price: "$2.20" },
        { title: "5000 مشاهدة منشورات تيليجرام", price: "$0.70" }
      ],
      facebook: [
        { title: "1000 متابع صفحة أو بروفايل فيسبوك", price: "$3.20" },
        { title: "1000 لايك وتفاعل منشورات", price: "$1.50" }
      ],
      twitter: [
        { title: "1000 متابع تويتر / X حقيقي", price: "$5.50" },
        { title: "1000 إعادة تغريد (ريتويت) ولايك", price: "$2.50" }
      ],
      other: [
        { title: "10,000 زيارة موقع إلكتروني (حركة مرور)", price: "$3.00" },
        { title: "تقييمات 5 نجوم مع تعليقات مخصصة", price: "$6.00" }
      ]
    };

    let selectedItem = null;

    function showCategory(cat, btn) {
      document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      const titles = {
        tiktok: "خدمات تيك توك المتوفرة",
        instagram: "خدمات إنستغرام المتوفرة",
        snapchat: "خدمات سناب شات المتوفرة",
        youtube: "خدمات يوتيوب المتوفرة",
        telegram: "خدمات تيليجرام المتوفرة",
        facebook: "خدمات فيسبوك المتوفرة",
        twitter: "خدمات تويتر (X) المتوفرة",
        other: "خدمات الزيارات وحركة المرور"
      };
      document.getElementById('categoryTitle').innerText = titles[cat];

      const box = document.getElementById('servicesBox');
      box.innerHTML = "";

      DATABASE[cat].forEach((item, idx) => {
        box.innerHTML += `
          <div class="service-card">
            <div class="service-title">${item.title}</div>
            <div class="service-meta">
              <span class="service-price">${item.price}</span>
              <button class="btn-buy" onclick="openOrderModal('${cat}', ${idx})">طلب</button>
            </div>
          </div>
        `;
      });
    }

    function openOrderModal(cat, idx) {
      selectedItem = DATABASE[cat][idx];
      document.getElementById('popTitle').innerText = selectedItem.title;
      document.getElementById('popPrice').innerText = selectedItem.price;

      const waBtn = document.getElementById('waButton');
      waBtn.onclick = function() {
        const acc = document.getElementById('targetAccount').value.trim();
        if(!acc) {
          alert('يرجى كتابة الرابط أو اسم الحساب أولاً');
          return false;
        }
        const text = encodeURIComponent(`مرحباً، أود طلب الخدمة التالية:\n- الخدمة: ${selectedItem.title}\n- الحساب أو الرابط: ${acc}\n- السعر: ${selectedItem.price}`);
        waBtn.href = `https://wa.me/${MY_PHONE}?text=${text}`;
      };

      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    // تشغيل تيك توك افتراضياً عند فتح الموقع
    showCategory('tiktok');
  </script>
</body>
</html>
