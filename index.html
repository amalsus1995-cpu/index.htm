<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOST ZONE | منصة دعم الحسابات الاحترافية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070913;
      --card-bg: rgba(18, 23, 41, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --tiktok-glow: #fe2c55;
      --tiktok-cyan: #25f4ee;
      --insta-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --snap-glow: #fffc00;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(254, 44, 85, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(37, 244, 238, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .glass-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
      padding: 35px 25px;
      position: relative;
      overflow: hidden;
    }

    .glass-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--tiktok-cyan), var(--tiktok-glow), #fffc00, var(--accent));
    }

    /* شريط العرض الترويجي */
    .promo-banner {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 40%, var(--text-sub) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-sub);
      font-size: 14px;
    }

    /* منصات السوشيال ميديا */
    .platform-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .tab-btn {
      position: relative;
      background: rgba(13, 17, 30, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-sub);
      font-weight: 700;
      font-size: 14px;
    }

    .tab-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .tab-btn:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-btn.active.tiktok {
      background: rgba(254, 44, 85, 0.08);
      border-color: var(--tiktok-glow);
      color: #fff;
      box-shadow: 0 0 20px rgba(254, 44, 85, 0.25);
    }
    .tab-btn.active.tiktok svg { fill: var(--tiktok-glow); transform: scale(1.1); }

    .tab-btn.active.instagram {
      background: rgba(225, 48, 108, 0.08);
      border-color: #e1306c;
      color: #fff;
      box-shadow: 0 0 20px rgba(225, 48, 108, 0.25);
    }
    .tab-btn.active.instagram svg { fill: #e1306c; transform: scale(1.1); }

    .tab-btn.active.snapchat {
      background: rgba(255, 252, 0, 0.08);
      border-color: var(--snap-glow);
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 252, 0, 0.25);
    }
    .tab-btn.active.snapchat svg { fill: var(--snap-glow); transform: scale(1.1); }

    /* شبكة أنواع الخدمات */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .srv-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }

    .srv-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      font-weight: 700;
    }

    /* الحقول والإدخالات */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input, select, textarea {
      width: 100%;
      background: #090d1a;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
      font-size: 13px;
    }

    /* لوحة عرض السعر والضمان */
    .checkout-summary {
      background: linear-gradient(180deg, rgba(20, 26, 48, 0.6) 0%, rgba(10, 14, 28, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-tag {
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .features-list {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #10b981;
      font-weight: 600;
    }

    /* أزرار العمليات */
    .btn-fire {
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-fire:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7);
    }

    /* النافذة المنبثقة للمودال */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      background: #0f
