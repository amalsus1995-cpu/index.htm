<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر فالكون | لخدمات التواصل الاجتماعي</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --tiktok: #fe2c55;
      --insta: #e1306c;
      --snap: #fffc00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.15);
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #cbd5e1;
    }

    select, input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .price-box {
      background: #0b1120;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border: 1px dashed var(--border);
    }

    .price-box span {
      color: var(--text-muted);
      font-size: 14px;
    }

    .price-amount {
      font-size: 22px;
      font-weight: 700;
      color: #10b981;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    /* نافذة الدفع */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .modal-content h3 {
      margin-bottom: 12px;
    }

    .crypto-address {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin: 15px 0;
      border: 1px solid var(--border);
      color: #38bdf8;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-wa {
      background: #25d366;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: block;
    }

    .btn-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>منصة فالكون للخدمات</h1>
      <p>تنفيذ فوري لخدمات المتابعين والتفاعل دون الحاجة لكلمة المرور</p>
    </header>

    <!-- أزرار المنصات -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchPlatform('tiktok', this)">تيك توك</button>
      <button class="tab-btn" onclick="switchPlatform('instagram', this)">انستغرام</button>
      <button class="tab-btn" onclick="switchPlatform('snapchat', this)">سناب شات</button>
    </div>

    <!-- نموذج الطلب -->
    <form id="orderForm" onsubmit="handleOrder(event)">
      <div class="form-group">
        <label id="inputLabel" for="accountInput">اسم المستخدم أو رابط الحساب في تيك توك</label>
        <input type="text" id="accountInput" placeholder="@username أو الرابط المباشر" required>
      </div>

      <div class="form-group">
        <label for="packageSelect">اختر الباقة</label>
        <select id="packageSelect" onchange="updatePrice()"></select>
      </div>

      <div class="price-box">
        <span>السعر الإجمالي المطلوب:</span>
        <div class="price-amount" id="totalPrice">0.00 $</div>
      </div>

      <button type="submit" class="submit-btn">متابعة إتمام الطلب</button>
    </form>
  </div>

  <!-- نافذة إتمام الطلب والدفع -->
  <div class="modal" id="paymentModal">
    <div class="modal-content">
      <h3>تفاصيل الطلب والدفع</h3>
      <p style="font-size: 14px; color: var(--text-muted);" id="orderSummary"></p>

      <div style="text-align: right; margin-top: 15px;">
        <label style="font-size: 13px;">عنوان الدفع المباشر (USDT TRC20):</label>
        <div class="crypto-address" id="walletAddress">TXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</div>
      </div>

      <div class="action-group">
        <a id="whatsappBtn" class="btn-wa" target="_blank">تأكيد وإرسال الإشعار عبر واتساب</a>
        <button class="btn-close" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    // إعدادات المتجر
    const CONFIG = {
      whatsappNumber: "905XXXXXXXXX", // استبدل برقم هاتفك الدولي
      usdtWallet: "TFxxxxxxxYourTRC20Addressxxxxxxxxxx" // عنوان محفظتك
    };

    // باقات الخدمات والأسعار (بالدولار كمثال)
    const PACKAGES = {
      tiktok: [
        { name: "500 متابع حقيقي/سريع", price: 2.5 },
        { name: "1,000 متابع ضمان 30 يوم", price: 4.5 },
        { name: "2,500 متابع عرض مميز", price: 9.9 },
        { name: "5,000 مشاهدة للفيديوهات", price: 1.5 }
      ],
      instagram: [
        { name: "500 متابع مكس", price: 2.0 },
        { name: "1,000 متابع مع ضمان تعويض", price: 3.8 },
        { name: "2,000 متابع VIP", price: 7.0 },
        { name: "1,000 لايك موزعة", price: 1.2 }
      ],
      snapchat: [
        { name: "500 إضافة سناب", price: 4.0 },
        { name: "1,000 متابع للملف التعريفي", price: 7.5 },
        { name: "2,500 متابع للملف التعريفي", price: 16.0 },
        { name: "5,000 مشاهدة ستوري", price: 5.0 }
      ]
    };

    let currentPlatform = 'tiktok';

    function switchPlatform(platform, btnElement) {
      currentPlatform = platform;
      
      // تحديث مظهر الأزرار
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      // تعديل عنوان الحقل
      const labels = {
        tiktok: "اسم المستخدم أو رابط الحساب في تيك توك",
        instagram: "اسم المستخدم أو رابط الحساب في انستغرام",
        snapchat: "اسم المستخدم (Username) أو رابط السناب"
      };
      document.getElementById('inputLabel').innerText = labels[platform];

      renderPackages();
    }

    function renderPackages() {
      const select = document.getElementById('packageSelect');
      select.innerHTML = '';

      PACKAGES[currentPlatform].forEach((pkg, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${pkg.name} — (${pkg.price} $)`;
        select.appendChild(option);
      });

      updatePrice();
    }

    function updatePrice() {
      const selectedIndex = document.getElementById('packageSelect').value;
      const selectedPkg = PACKAGES[currentPlatform][selectedIndex];
      if (selectedPkg) {
        document.getElementById('totalPrice').innerText = `${selectedPkg.price.toFixed(2)} $`;
      }
    }

    function handleOrder(e) {
      e.preventDefault();
      const account = document.getElementById('accountInput').value.trim();
      const selectedIndex = document.getElementById('packageSelect').value;
      const selectedPkg = PACKAGES[currentPlatform][selectedIndex];

      const summary = `المنصة: ${currentPlatform.toUpperCase()} | الباقة: ${selectedPkg.name} | السعر: ${selectedPkg.price} $`;
      document.getElementById('orderSummary').innerText = summary;
      document.getElementById('walletAddress').innerText = CONFIG.usdtWallet;

      // إعداد رسالة الواتساب الجاهزة
      const msg = encodeURIComponent(`طلب جديد:\n- المنصة: ${currentPlatform}\n- الحساب: ${account}\n- الباقة: ${selectedPkg.name}\n- المبلغ: ${selectedPkg.price} $\n- تم تحويل الدفعة.`);
      document.getElementById('whatsappBtn').href = `https://wa.me/${CONFIG.whatsappNumber}?text=${msg}`;

      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    // تهيئة الصفحة عند الفتح
    renderPackages();
  </script>
</body>
</html>
